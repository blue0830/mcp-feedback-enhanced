<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Feedback Enhanced - 桌面版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        
        .loading-container {
            text-align: center;
            padding: 2rem;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeIn 1s ease-in-out forwards;
        }
        
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 1s ease-in-out 0.5s forwards;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
            opacity: 0;
            animation: fadeIn 1s ease-in-out 1s forwards, spin 1s linear 1s infinite;
        }
        
        .status {
            font-size: 1rem;
            opacity: 0.8;
            animation: fadeIn 1s ease-in-out 1.5s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="logo">🖥️ MCP Feedback Enhanced</div>
        <div class="subtitle">桌面版正在啟動...</div>
        <div class="spinner"></div>
        <div class="status" id="status">正在連接到後端服務...</div>
        <div class="error" id="error"></div>
    </div>

    <script>
        // 檢測是否在 Tauri 環境中
        const isTauri = window.__TAURI__ !== undefined;
        let backendUrl = '';

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        async function resolveBackendUrl() {
            const params = new URLSearchParams(window.location.search);
            const queryUrl = params.get('backend');
            if (queryUrl) {
                return queryUrl;
            }

            if (isTauri && window.__TAURI__?.core?.invoke) {
                try {
                    const runtimeUrl = await window.__TAURI__.core.invoke('get_web_url');
                    if (runtimeUrl && typeof runtimeUrl === 'string') {
                        return runtimeUrl;
                    }
                } catch (error) {
                    console.error('無法透過 Tauri 讀取後端 URL:', error);
                }
            }

            return '';
        }

        async function checkBackendService() {
            if (!backendUrl) {
                showError('找不到後端 URL，請重新啟動桌面應用程式');
                return;
            }

            try {
                updateStatus('正在檢查後端服務...');
                const controller = new AbortController();
                const timeoutHandle = setTimeout(() => controller.abort(), 5000);
                const response = await fetch(`${backendUrl}/health`, {
                    method: 'GET',
                    signal: controller.signal
                });
                clearTimeout(timeoutHandle);

                if (!response.ok) {
                    throw new Error(`後端服務回應錯誤: ${response.status}`);
                }

                updateStatus('後端服務已就緒，正在載入界面...');
                setTimeout(() => {
                    window.location.href = backendUrl;
                }, 500);
            } catch (error) {
                console.error('檢查後端服務失敗:', error);
                updateStatus('正在重試連接...');
                setTimeout(() => {
                    window.location.href = backendUrl;
                }, 1000);
            }
        }

        (async () => {
            backendUrl = await resolveBackendUrl();
            if (!backendUrl) {
                showError('桌面模式缺少後端 URL，請確認啟動流程是否正確');
                return;
            }

            if (!isTauri) {
                updateStatus('正在重定向到 Web 界面...');
                window.location.href = backendUrl;
                return;
            }

            setTimeout(checkBackendService, 500);
            setTimeout(() => {
                if (window.location.href.includes('index.html')) {
                    window.location.href = backendUrl;
                }
            }, 5000);
        })();
    </script>
</body>
</html>
